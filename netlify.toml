[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/analyze-item"
  to = "/.netlify/functions/analyze-item"
  status = 200

[[redirects]]
  from = "/api/listing-event"
  to = "/.netlify/functions/listing-event"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
